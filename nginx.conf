# nginx reverse-proxy for Flatland
# Serves Vite-built static files and proxies API/WS to the backend container.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # add_header directives are inherited only when the current level defines none.
    # Keep route cache control on expires so every response retains this full set.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-qVNbNpBzc9reLy+2+ftYOSmjlctlu4x0fvEZeUfjH54=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://world.minhnhan.in wss://world.minhnhan.in http://localhost:8000 ws://localhost:8000 http://127.0.0.1:8000 ws://127.0.0.1:8000 https://generativelanguage.googleapis.com https://api.openai.com https://cloudflareinsights.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for JSON/WS-ish text
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Static assets — long cache for hashed Vite chunks, no-cache for index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    client_max_body_size 16M;

    # Clean health URL — serves the static health page (same file as /health.html)
    location ~ ^/health/?$ {
        expires -1;
        try_files /health.html =404;
    }

    # WebSocket — must upgrade
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # No buffering for WS frames
        proxy_buffering off;
    }

    # Serve the checked-in Swagger assets and OpenAPI mirror; do not proxy
    # FastAPI's dynamic docs because its inline bootstrap is not CSP-compatible.
    location = /docs {
        expires -1;
        try_files /docs/index.html =404;
    }
    location ^~ /docs/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location = /redoc {
        return 302 /docs/;
    }
    location = /redoc/ {
        return 302 /docs/;
    }
    location = /openapi.json {
        expires -1;
        try_files /openapi.json =404;
    }

    # Backend REST and legacy metadata routes
    location ~ ^/(api|healthz|wiki|guide|robots\.txt|sitemap\.xml) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Allow large history payloads
        proxy_buffering on;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
