name: Deploy flws-web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        run: |
          npm run build
        env:
          VITE_BASE: "./"
          VITE_IS_DEMO: "true"
          VITE_DEMO_API_URL: ${{ secrets.DEMO_API_URL || 'https://world.minhnhan.in' }}
          VITE_DEMO_WS_URL: ${{ secrets.DEMO_WS_URL || 'wss://world.minhnhan.in/ws' }}
          FRONTEND_URL: "https://longphanmn.github.io/flws-web/"
          LANDING_URL: "https://longphanmn.github.io/flws-page/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
