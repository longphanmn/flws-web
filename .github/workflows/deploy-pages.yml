name: Deploy flws-web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://longphanmn.github.io/flws-web/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        run: |
          npm run build
        env:
          VITE_BASE: "./"
          VITE_IS_DEMO: "true"
          API_URL: ${{ vars.API_URL || secrets.API_URL || '' }}
          VITE_DEMO_API_URL: ${{ vars.API_URL || secrets.API_URL || vars.VITE_DEMO_API_URL || secrets.VITE_DEMO_API_URL || '' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL || '' }}
          WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL || vars.WS_URL || secrets.WS_URL || '' }}
          VITE_DEMO_WS_URL: ${{ vars.VITE_WS_URL || secrets.VITE_WS_URL || vars.VITE_DEMO_WS_URL || secrets.VITE_DEMO_WS_URL || '' }}
          FRONTEND_URL: "https://longphanmn.github.io/flws-web/"
          LANDING_URL: "https://longphanmn.github.io/flws-page/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
