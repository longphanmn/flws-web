<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- GitHub Pages cannot send HTTP headers, so this meta-CSP is best-effort there; nginx (prod) delivers the full header including frame-ancestors 'none'. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-6rupQTILXID60QeOhyelVeWvFLLWNeAU2K64WPoXk24=' 'sha256-4QynFDob4uTf9/x9tqhUDPBuXNixfIAdWd5hRzkw73g='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://world.minhnhan.in wss://world.minhnhan.in http://localhost:8000 ws://localhost:8000 http://127.0.0.1:8000 ws://127.0.0.1:8000 https://generativelanguage.googleapis.com https://api.openai.com; object-src 'none'; base-uri 'self';" />
  <title>Redirecting — Flatland</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px 32px;
      max-width: 420px;
    }
  </style>
  <script>
    (function () {
      var origin = window.location.origin;
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var path = pathname.toLowerCase();

      var repoPrefix = '';
      if (pathname.indexOf('/flws-web') === 0) {
        repoPrefix = '/flws-web';
      }

      var base = origin + repoPrefix;
      var landingBase = 'https://longphanmn.github.io/flws-page';

      var target = base + '/';

      if (path.indexOf('god-laws.md') !== -1) {
        target = base + '/docs/god-laws.md' + hash;
      } else if (path.indexOf('wiki') !== -1) {
        target = base + '/wiki/' + search + hash;
      } else if (path.indexOf('docs') !== -1) {
        target = base + '/docs/' + search;
      } else if (path.indexOf('openapi.json') !== -1) {
        target = base + '/openapi.json';
      } else if (path.indexOf('health') !== -1) {
        target = base + '/health/' + search;
      } else if (path.indexOf('landing') !== -1 || path.indexOf('intro') !== -1 || path.indexOf('page') !== -1) {
        target = landingBase + '/';
      }

      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h2>Redirecting…</h2>
    <p>Navigating to Flatland resource.</p>
    <p><a href="./" id="home-link">Return to Flatland Home</a></p>
    <script>try{document.getElementById('home-link').href = (window.location.pathname.indexOf('/flws-web') === 0 ? '/flws-web/' : '/');}catch(e){}</script>
  </div>
</body>
</html>
